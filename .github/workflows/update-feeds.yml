name: Update RSS feeds

on:
  schedule:
    - cron: "0 * * * *"   # every hour — ajuste si tu veux plus/moins fréquent
  workflow_dispatch: {}    # bouton "Run workflow" manuel dans l'onglet Actions
  push:
    paths:
      - feeds.json
      - scripts/fetch_feeds.py
      - .github/workflows/update-feeds.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser

      - name: Fetch feeds
        run: python scripts/fetch_feeds.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed_items.json
          git diff --staged --quiet || git commit -m "chore: update veille feeds"
          git push
