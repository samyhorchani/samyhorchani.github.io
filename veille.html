<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Veille — Samy HORCHANI</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

:root {
  --green: #00ff9f;
  --green-dim: #00cc7a;
  --cyan: #00e5ff;
  --amber: #ffb300;
  --violet: #a78bfa;
  --slate: #94a3b8;
}

html { scroll-padding-top: 80px; }
body { font-family: 'Inter', sans-serif; }
.mono { font-family: 'JetBrains Mono', monospace; }

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg, transparent, transparent 2px,
    rgba(0,255,159,0.015) 2px, rgba(0,255,159,0.015) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

.glow { text-shadow: 0 0 8px var(--green); }

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
.cursor::after {
  content: '█';
  color: var(--green);
  animation: blink 1s step-end infinite;
  margin-left: 2px;
}

.tag-crypto    { background: rgba(0,255,159,0.08); color: #00ff9f; border: 1px solid rgba(0,255,159,0.25); }
.tag-recherche { background: rgba(0,229,255,0.08); color: #00e5ff; border: 1px solid rgba(0,229,255,0.25); }
.tag-anssi     { background: rgba(255,179,0,0.08); color: #ffb300; border: 1px solid rgba(255,179,0,0.25); }
.tag-veille    { background: rgba(167,139,250,0.1); color: #a78bfa; border: 1px solid rgba(167,139,250,0.25); }
.tag-neutral   { background: rgba(255,255,255,0.05); color: #94a3b8; border: 1px solid rgba(255,255,255,0.1); }

.card {
  border: 1px solid rgba(0,255,159,0.12);
  background: rgba(0,10,5,0.6);
  border-radius: 0.5rem;
  padding: 1.5rem;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.card:hover { border-color: rgba(0,255,159,0.3); box-shadow: 0 0 24px rgba(0,255,159,0.06); }

.section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: var(--green);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-bottom: 0.5rem;
}

nav a.nav-link { position: relative; }
nav a.nav-link::after {
  content: '';
  display: block;
  height: 1px;
  background: var(--green);
  transform: scaleX(0);
  transition: transform 0.2s;
}
nav a.nav-link:hover::after,
nav a.nav-link.active::after { transform: scaleX(1); }
nav a.nav-link.active { color: var(--green); }

/* Filter chips */
.chip {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  padding: 0.25rem 0.75rem;
  border-radius: 9999px;
  cursor: pointer;
  opacity: 0.55;
  transition: opacity 0.15s, box-shadow 0.15s;
}
.chip:hover { opacity: 0.85; }
.chip.active { opacity: 1; box-shadow: 0 0 12px rgba(0,255,159,0.12); }

/* Search */
.search {
  width: 100%;
  background: rgba(0,10,5,0.6);
  border: 1px solid rgba(0,255,159,0.15);
  border-radius: 0.375rem;
  color: #e2e8f0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85rem;
  padding: 0.6rem 0.9rem;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.search:focus { outline: none; border-color: rgba(0,255,159,0.5); box-shadow: 0 0 12px rgba(0,255,159,0.08); }
.search::placeholder { color: #64748b; }

/* Feed items */
.day-heading {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.7rem;
  color: #64748b;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin: 2rem 0 0.75rem;
}
.day-heading::before { content: '// '; color: var(--green-dim); }
.day-heading:first-child { margin-top: 0; }

.item {
  display: block;
  padding: 1rem 1.25rem;
  margin-bottom: 0.5rem;
  border: 1px solid rgba(0,255,159,0.08);
  background: rgba(0,10,5,0.6);
  border-radius: 0.5rem;
  text-decoration: none;
  transition: border-color 0.2s, box-shadow 0.2s, opacity 0.2s;
}
.item:hover { border-color: rgba(0,255,159,0.3); box-shadow: 0 0 24px rgba(0,255,159,0.06); }
.item:hover .item-title { color: var(--green); }
.item.read { opacity: 0.45; }
.item.read:hover { opacity: 0.8; }
.item-title { color: #e2e8f0; font-weight: 500; transition: color 0.15s; }

#status-dot {
  display: inline-block; width: 7px; height: 7px; border-radius: 50%;
  background: var(--green); box-shadow: 0 0 6px var(--green);
  margin-right: 0.5rem; vertical-align: middle;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: rgba(0,255,159,0.2); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }
</style>
</head>

<body class="bg-[#020c06] text-slate-200 antialiased">

<!-- Navbar -->
<header class="border-b border-[rgba(0,255,159,0.1)] sticky top-0 bg-[#020c06]/90 backdrop-blur z-50">
  <nav class="max-w-5xl mx-auto px-6 py-4 flex flex-wrap gap-y-3 justify-between items-center">
    <a href="index.html" class="mono text-sm text-[#00ff9f] glow">~/samy.horchani<span class="cursor"></span></a>
    <div class="flex flex-wrap items-center gap-x-6 gap-y-2 text-sm text-slate-400">
      <a href="index.html#work" class="nav-link hover:text-[#00ff9f] transition-colors" data-fr="Expériences" data-en="Work"></a>
      <a href="index.html#projects" class="nav-link hover:text-[#00ff9f] transition-colors" data-fr="Projets" data-en="Projects"></a>
      <a href="notes.html" class="nav-link hover:text-[#00ff9f] transition-colors" data-fr="Notes" data-en="Notes"></a>
      <a href="veille.html" class="nav-link active" data-fr="Veille" data-en="Watch"></a>
      <button onclick="switchLang()" class="mono px-3 py-1 border border-[rgba(0,255,159,0.25)] rounded text-xs text-[#00ff9f] hover:bg-[rgba(0,255,159,0.08)] transition-colors">FR / EN</button>
    </div>
  </nav>
</header>

<!-- Header -->
<section class="max-w-5xl mx-auto px-6 pt-16 pb-8">
  <p class="section-label">$ tail -f ./veille</p>
  <h1 class="text-4xl font-bold tracking-tight">
    <span data-fr="Veille" data-en="Watch"></span> <span class="text-[#00ff9f]" data-fr="crypto & sécurité" data-en="crypto & security"></span>
  </h1>
  <p class="mt-3 text-slate-400 max-w-2xl leading-relaxed"
     data-fr="Agrégation automatique de flux : recherche (IACR ePrint…), ANSSI / CERT-FR, blogs crypto et actualité sécurité."
     data-en="Automatically aggregated feeds: research (IACR ePrint…), ANSSI / CERT-FR, crypto blogs and security news.">
  </p>
</section>

<!-- Feed -->
<section class="max-w-5xl mx-auto px-6 pb-24">
  <div class="card mb-8">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4 mono text-xs text-slate-400">
      <span><span id="status-dot"></span><span id="last-update"></span></span>
      <span id="unread-count" class="text-[#00ff9f]"></span>
    </div>
    <input class="search mb-4" id="search" type="text">
    <div class="flex flex-wrap gap-2" id="chips"></div>
  </div>

  <div id="err-state" class="hidden mb-6 rounded-lg border border-[rgba(255,179,0,0.3)] bg-[rgba(255,179,0,0.05)] px-4 py-3 mono text-xs text-[#ffb300]"></div>
  <div id="list"></div>
  <div id="empty-state" class="hidden rounded-lg border border-dashed border-[rgba(0,255,159,0.2)] px-5 py-6 mono text-sm text-slate-500"></div>
</section>

<footer class="border-t border-[rgba(0,255,159,0.1)] py-8 text-center">
  <p class="mono text-xs text-slate-600"
     data-fr="// 2026 · Samy HORCHANI · flux mis à jour automatiquement chaque heure"
     data-en="// 2026 · Samy HORCHANI · feeds refreshed automatically every hour"></p>
</footer>

<script>
let currentLang = "en";

const I18N = {
  fr: {
    loading: "chargement…",
    updated: "mis à jour ",
    waiting: "en attente du premier passage",
    loadError: "erreur de chargement",
    unread: n => n + " non lus",
    search: "filtrer par mot-clé…",
    all: "tout",
    justNow: "à l'instant",
    day: "j",
    today: "aujourd'hui",
    yesterday: "hier",
    undated: "sans date",
    noData: "Aucune donnée pour l'instant. Le premier passage du workflow <code>update-feeds.yml</code> n'a peut-être pas encore tourné — lance-le manuellement depuis l'onglet <em>Actions</em> du repo.",
    noMatch: "Aucun article ne correspond à ce filtre.",
    fetchFail: "Impossible de charger data/feed_items.json.",
    feedErrors: n => n + " flux en erreur : ",
    locale: "fr-FR",
  },
  en: {
    loading: "loading…",
    updated: "updated ",
    waiting: "waiting for first run",
    loadError: "loading error",
    unread: n => n + " unread",
    search: "filter by keyword…",
    all: "all",
    justNow: "just now",
    day: "d",
    today: "today",
    yesterday: "yesterday",
    undated: "undated",
    noData: "No data yet. The <code>update-feeds.yml</code> workflow may not have run yet — trigger it manually from the repo's <em>Actions</em> tab.",
    noMatch: "No article matches this filter.",
    fetchFail: "Could not load data/feed_items.json.",
    feedErrors: n => n + " feed(s) failing: ",
    locale: "en-GB",
  },
};
const t = () => I18N[currentLang];

function applyStaticLang() {
  document.documentElement.lang = currentLang;
  document.querySelectorAll("[data-fr]").forEach(el => {
    el.textContent = el.dataset[currentLang];
  });
  document.getElementById("search").placeholder = t().search;
}

function switchLang() {
  currentLang = currentLang === "en" ? "fr" : "en";
  applyStaticLang();
  if (window.veilleRender) window.veilleRender();
}

(function(){
  const DATA_URL = "data/feed_items.json";
  const READ_KEY = "veille_read_ids";
  const CATEGORY_TAG = { crypto: "tag-crypto", recherche: "tag-recherche", anssi: "tag-anssi", veille: "tag-veille" };
  const CATEGORY_LABEL = {
    fr: { crypto: "crypto", recherche: "recherche", anssi: "anssi", veille: "actu" },
    en: { crypto: "crypto", recherche: "research", anssi: "anssi", veille: "news" },
  };

  const els = {
    list: document.getElementById("list"),
    chips: document.getElementById("chips"),
    search: document.getElementById("search"),
    lastUpdate: document.getElementById("last-update"),
    unreadCount: document.getElementById("unread-count"),
    empty: document.getElementById("empty-state"),
    err: document.getElementById("err-state"),
    dot: document.getElementById("status-dot"),
  };

  let DATA = null;
  let ITEMS = [];
  let loadFailed = false;
  let activeCategory = "all";
  let query = "";

  // Feed text is plain text with HTML entities (&nbsp;, &#8217;…): decode
  // them without ever interpreting markup, then insert via textContent.
  const decoder = document.createElement("textarea");
  function decode(s){ decoder.innerHTML = s || ""; return decoder.value; }

  function getReadIds(){
    try { return new Set(JSON.parse(localStorage.getItem(READ_KEY) || "[]")); }
    catch(e){ return new Set(); }
  }
  function markRead(id){
    const set = getReadIds();
    set.add(id);
    try { localStorage.setItem(READ_KEY, JSON.stringify([...set])); } catch(e){}
  }

  function catLabel(cat){ return CATEGORY_LABEL[currentLang][cat] || cat; }

  function timeAgo(iso){
    if(!iso) return "";
    const diffMs = Date.now() - new Date(iso).getTime();
    const h = Math.floor(diffMs / 3600000);
    if (h < 1) return t().justNow;
    if (h < 24) return h + "h";
    const d = Math.floor(h / 24);
    if (d < 7) return d + t().day;
    return new Date(iso).toLocaleDateString(t().locale, {day:"numeric", month:"short"});
  }

  function dayLabel(iso){
    if(!iso) return t().undated;
    const d = new Date(iso);
    const today = new Date();
    const yest = new Date(Date.now() - 86400000);
    const sameDay = (a,b) => a.toDateString() === b.toDateString();
    if (sameDay(d, today)) return t().today;
    if (sameDay(d, yest)) return t().yesterday;
    return d.toLocaleDateString(t().locale, {weekday:"long", day:"numeric", month:"long"});
  }

  function el(tag, cls, text){
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function renderStatus(){
    if (loadFailed){
      els.lastUpdate.textContent = t().loadError;
      return;
    }
    if (!DATA){ els.lastUpdate.textContent = t().loading; return; }
    els.lastUpdate.textContent = DATA.generated_at ? t().updated + timeAgo(DATA.generated_at) : t().waiting;

    if (DATA.errors && DATA.errors.length){
      els.err.classList.remove("hidden");
      els.err.textContent = t().feedErrors(DATA.errors.length);
      DATA.errors.forEach((e, i) => {
        if (i) els.err.appendChild(document.createTextNode(", "));
        els.err.appendChild(el("code", "text-slate-300", e.source));
      });
    }
  }

  function renderChips(){
    const cats = ["all", ...new Set(ITEMS.map(i => i.category))];
    els.chips.innerHTML = "";
    cats.forEach(cat => {
      const b = el("button",
        "chip " + (cat === "all" ? "tag-neutral" : (CATEGORY_TAG[cat] || "tag-neutral")) + (cat === activeCategory ? " active" : ""),
        cat === "all" ? t().all : catLabel(cat));
      b.onclick = () => { activeCategory = cat; renderChips(); renderList(); };
      els.chips.appendChild(b);
    });
  }

  function renderList(){
    const readIds = getReadIds();
    const q = query.trim().toLowerCase();

    const filtered = ITEMS.filter(i => {
      if (activeCategory !== "all" && i.category !== activeCategory) return false;
      if (!q) return true;
      return (i.title + " " + i.source + " " + i.summary).toLowerCase().includes(q);
    });

    els.unreadCount.textContent = DATA ? t().unread(filtered.filter(i => !readIds.has(i.id)).length) : "";

    els.list.innerHTML = "";
    if (loadFailed){
      els.empty.classList.remove("hidden");
      els.empty.textContent = t().fetchFail;
      return;
    }
    if (!DATA) return;
    if (filtered.length === 0){
      els.empty.classList.remove("hidden");
      if (ITEMS.length === 0) els.empty.innerHTML = t().noData;
      else els.empty.textContent = t().noMatch;
      return;
    }
    els.empty.classList.add("hidden");

    let lastDay = null;
    filtered.forEach(item => {
      const day = dayLabel(item.published);
      if (day !== lastDay){
        els.list.appendChild(el("div", "day-heading", day));
        lastDay = day;
      }

      const a = el("a", "item" + (readIds.has(item.id) ? " read" : ""));
      a.href = item.link;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.onclick = () => { markRead(item.id); a.classList.add("read"); renderUnread(); };

      const top = el("div", "flex flex-wrap items-center gap-2 mb-2 mono text-[0.7rem] text-slate-500");
      top.appendChild(el("span", "px-2 py-0.5 rounded-full " + (CATEGORY_TAG[item.category] || "tag-neutral"), decode(item.source)));
      top.appendChild(el("span", null, timeAgo(item.published)));
      a.appendChild(top);

      a.appendChild(el("div", "item-title", decode(item.title)));
      if (item.summary) a.appendChild(el("p", "mt-1 text-sm text-slate-400 leading-relaxed max-w-3xl", decode(item.summary)));
      els.list.appendChild(a);
    });
  }

  function renderUnread(){
    const readIds = getReadIds();
    const q = query.trim().toLowerCase();
    const n = ITEMS.filter(i =>
      (activeCategory === "all" || i.category === activeCategory) &&
      (!q || (i.title + " " + i.source + " " + i.summary).toLowerCase().includes(q)) &&
      !readIds.has(i.id)).length;
    els.unreadCount.textContent = t().unread(n);
  }

  window.veilleRender = () => { renderStatus(); renderChips(); renderList(); };

  els.search.addEventListener("input", e => { query = e.target.value; renderList(); });

  applyStaticLang();
  renderStatus();

  fetch(DATA_URL, {cache: "no-store"})
    .then(r => r.json())
    .then(data => {
      DATA = data;
      ITEMS = data.items || [];
      if (!data.generated_at){ els.dot.style.background = "var(--amber)"; els.dot.style.boxShadow = "0 0 6px var(--amber)"; }
      window.veilleRender();
    })
    .catch(() => {
      loadFailed = true;
      els.dot.style.background = "var(--amber)";
      els.dot.style.boxShadow = "0 0 6px var(--amber)";
      window.veilleRender();
    });
})();
</script>
</body>
</html>
