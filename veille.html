<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veille — Samy HORCHANI</title>
<style>
  :root{
    --bg:#0b0d0c;
    --bg-raised:#111413;
    --line:#1f2624;
    --text:#d7ddd9;
    --text-dim:#7d8b85;
    --accent:#5fe38c;
    --accent-dim:#2f6b48;
    --warn:#e3b95f;
    --font-mono:"JetBrains Mono","SFMono-Regular",Consolas,Menlo,monospace;
    --maxw:760px;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:70px;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-mono);
    font-size:15px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  header{
    position:sticky; top:0; z-index:10;
    background:rgba(11,13,12,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    max-width:var(--maxw); margin:0 auto; padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap;
  }
  .brand{font-size:14px; color:var(--text-dim); text-decoration:none;}
  .brand b{color:var(--accent); font-weight:500;}
  .links{display:flex; gap:18px; font-size:13px;}
  .links a{color:var(--text-dim); text-decoration:none; border-bottom:1px solid transparent;}
  .links a:hover, .links a:focus-visible{color:var(--text); border-color:var(--accent);}
  .links a.current{color:var(--accent);}

  main{max-width:var(--maxw); margin:0 auto; padding:28px 20px 80px;}

  .prompt{color:var(--text-dim); font-size:13px; margin:0 0 4px;}
  .prompt::before{content:"$ "; color:var(--accent);}
  h1{font-size:20px; font-weight:500; margin:0 0 22px; color:var(--text);}

  .meta-row{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; flex-wrap:wrap; margin-bottom:18px;
    font-size:12px; color:var(--text-dim);
  }
  #status-dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--accent); margin-right:6px; box-shadow:0 0 6px var(--accent);}

  .controls{
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px;
    padding-bottom:18px; border-bottom:1px solid var(--line);
  }
  .chip{
    font-family:var(--font-mono); font-size:12px; color:var(--text-dim);
    background:var(--bg-raised); border:1px solid var(--line);
    padding:5px 11px; border-radius:3px; cursor:pointer;
    transition:border-color .15s, color .15s;
  }
  .chip:hover{color:var(--text); border-color:var(--text-dim);}
  .chip.active{color:var(--bg); background:var(--accent); border-color:var(--accent);}

  .search{
    width:100%; margin-bottom:22px;
    background:var(--bg-raised); border:1px solid var(--line); border-radius:3px;
    color:var(--text); font-family:var(--font-mono); font-size:13px;
    padding:9px 12px;
  }
  .search:focus{outline:none; border-color:var(--accent-dim);}
  .search::placeholder{color:var(--text-dim);}

  .day-heading{
    font-size:12px; color:var(--text-dim); margin:26px 0 10px;
    text-transform:lowercase;
  }
  .day-heading:first-of-type{margin-top:0;}

  .item{
    display:block; padding:14px 0; border-bottom:1px solid var(--line);
    text-decoration:none; color:var(--text);
    transition:opacity .15s;
  }
  .item:hover .item-title{color:var(--accent);}
  .item.read{opacity:0.45;}
  .item-top{display:flex; gap:10px; align-items:baseline; font-size:11.5px; color:var(--text-dim); margin-bottom:5px; flex-wrap:wrap;}
  .item-source{color:var(--accent-dim); background:rgba(95,227,140,0.08); padding:1px 7px; border-radius:2px;}
  .item-title{font-size:14.5px; color:var(--text); display:block; margin-bottom:4px;}
  .item-summary{font-size:12.5px; color:var(--text-dim); max-width:64ch;}

  .empty, .errbox{
    font-size:13px; color:var(--text-dim); border:1px dashed var(--line);
    border-radius:4px; padding:18px; margin-top:10px;
  }
  .errbox{border-color:var(--warn); color:var(--warn);}
  .empty code, .errbox code{color:var(--text); background:var(--bg-raised); padding:1px 5px; border-radius:2px;}

  footer{max-width:var(--maxw); margin:0 auto; padding:0 20px 40px; font-size:11px; color:var(--text-dim);}

  @media (max-width:480px){
    .nav{padding:12px 16px;}
    main{padding:22px 16px 60px;}
  }
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="brand" href="index.html">~/samy.horchani</a>
    <nav class="links">
      <a href="index.html#work">work</a>
      <a href="index.html#projects">projects</a>
      <a href="notes.html">notes</a>
      <a href="veille.html" class="current">veille</a>
    </nav>
  </div>
</header>

<main>
  <p class="prompt">tail -f ./veille</p>
  <h1>Veille crypto &amp; sécurité</h1>

  <div class="meta-row">
    <span><span id="status-dot"></span><span id="last-update">chargement…</span></span>
    <span id="unread-count"></span>
  </div>

  <input class="search" id="search" type="text" placeholder="filtrer par mot-clé…">

  <div class="controls" id="chips"></div>

  <div id="list"></div>
  <div id="empty-state" class="empty" style="display:none;"></div>
  <div id="err-state" class="errbox" style="display:none;"></div>
</main>

<footer>flux mis à jour automatiquement chaque heure · source : feeds.json</footer>

<script>
(function(){
  const DATA_URL = "data/feed_items.json";
  const READ_KEY = "veille_read_ids";

  const els = {
    list: document.getElementById("list"),
    chips: document.getElementById("chips"),
    search: document.getElementById("search"),
    lastUpdate: document.getElementById("last-update"),
    unreadCount: document.getElementById("unread-count"),
    empty: document.getElementById("empty-state"),
    err: document.getElementById("err-state"),
    dot: document.getElementById("status-dot"),
  };

  let ITEMS = [];
  let activeCategory = "all";
  let query = "";

  function getReadIds(){
    try { return new Set(JSON.parse(localStorage.getItem(READ_KEY) || "[]")); }
    catch(e){ return new Set(); }
  }
  function markRead(id){
    const set = getReadIds();
    set.add(id);
    try { localStorage.setItem(READ_KEY, JSON.stringify([...set])); } catch(e){}
  }

  function timeAgo(iso){
    if(!iso) return "";
    const diffMs = Date.now() - new Date(iso).getTime();
    const h = Math.floor(diffMs / 3600000);
    if (h < 1) return "à l'instant";
    if (h < 24) return h + "h";
    const d = Math.floor(h / 24);
    if (d < 7) return d + "j";
    return new Date(iso).toLocaleDateString("fr-FR", {day:"numeric", month:"short"});
  }

  function dayLabel(iso){
    if(!iso) return "sans date";
    const d = new Date(iso);
    const today = new Date();
    const yest = new Date(Date.now() - 86400000);
    const sameDay = (a,b) => a.toDateString() === b.toDateString();
    if (sameDay(d, today)) return "aujourd'hui";
    if (sameDay(d, yest)) return "hier";
    return d.toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"});
  }

  function renderChips(){
    const cats = ["all", ...new Set(ITEMS.map(i => i.category))];
    els.chips.innerHTML = "";
    cats.forEach(cat => {
      const b = document.createElement("button");
      b.className = "chip" + (cat === activeCategory ? " active" : "");
      b.textContent = cat === "all" ? "tout" : cat;
      b.onclick = () => { activeCategory = cat; renderChips(); renderList(); };
      els.chips.appendChild(b);
    });
  }

  function renderList(){
    const readIds = getReadIds();
    const q = query.trim().toLowerCase();

    const filtered = ITEMS.filter(i => {
      if (activeCategory !== "all" && i.category !== activeCategory) return false;
      if (!q) return true;
      return (i.title + " " + i.source + " " + i.summary).toLowerCase().includes(q);
    });

    els.unreadCount.textContent = filtered.filter(i => !readIds.has(i.id)).length + " non lus";

    els.list.innerHTML = "";
    if (filtered.length === 0){
      els.empty.style.display = "block";
      els.empty.innerHTML = ITEMS.length === 0
        ? "Aucune donnée pour l'instant. Le premier passage du workflow <code>update-feeds.yml</code> n'a peut-être pas encore tourné — lance-le manuellement depuis l'onglet <em>Actions</em> du repo."
        : "Aucun article ne correspond à ce filtre.";
      return;
    }
    els.empty.style.display = "none";

    let lastDay = null;
    filtered.forEach(item => {
      const day = dayLabel(item.published);
      if (day !== lastDay){
        const h = document.createElement("div");
        h.className = "day-heading";
        h.textContent = day;
        els.list.appendChild(h);
        lastDay = day;
      }

      const a = document.createElement("a");
      a.href = item.link;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.className = "item" + (readIds.has(item.id) ? " read" : "");
      a.onclick = () => markRead(item.id);

      a.innerHTML = `
        <div class="item-top">
          <span class="item-source">${item.source}</span>
          <span>${timeAgo(item.published)}</span>
        </div>
        <span class="item-title">${item.title}</span>
        ${item.summary ? `<span class="item-summary">${item.summary}</span>` : ""}
      `;
      els.list.appendChild(a);
    });
  }

  els.search.addEventListener("input", e => { query = e.target.value; renderList(); });

  fetch(DATA_URL, {cache: "no-store"})
    .then(r => r.json())
    .then(data => {
      ITEMS = data.items || [];
      els.lastUpdate.textContent = data.generated_at
        ? "mis à jour " + timeAgo(data.generated_at)
        : "en attente du premier passage";
      if (!data.generated_at) els.dot.style.background = "var(--warn)";

      if (data.errors && data.errors.length){
        els.err.style.display = "block";
        els.err.innerHTML = data.errors.length + " flux en erreur : " +
          data.errors.map(e => `<code>${e.source}</code>`).join(", ");
      }

      renderChips();
      renderList();
    })
    .catch(() => {
      els.lastUpdate.textContent = "erreur de chargement";
      els.dot.style.background = "var(--warn)";
      els.empty.style.display = "block";
      els.empty.textContent = "Impossible de charger data/feed_items.json.";
    });
})();
</script>
</body>
</html>
